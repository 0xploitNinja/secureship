name: SecureShip CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Application tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Install application dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

  sast:
    name: Python source security scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Install security tools
        run: python -m pip install -r requirements-dev.txt

      - name: Scan Python source with Bandit
        run: python -m bandit -r app

  sca:
    name: Dependency vulnerability audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Install security tools
        run: python -m pip install -r requirements-dev.txt

      - name: Audit application dependencies
        run: python -m pip_audit -r requirements.txt --strict

  secrets:
    name: Git history secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout full Git history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan Git history with Gitleaks
        run: |
          docker run --rm \
            -v "$PWD:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:v8.24.2 \
            git /repo --redact --exit-code 1

  build:
    name: Docker build, vulnerability report, and smoke test
    needs: [test, sast, sca, secrets]
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python for health check
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Build application image
        run: docker build -t secureship:ci .

      - name: Export image for security scanning
        run: docker save -o "$RUNNER_TEMP/secureship-image.tar" secureship:ci

      # Reporting only: vulnerability findings do not block this job.
      # Scanner execution errors still fail the step.
      - name: Report container vulnerabilities with Trivy
        run: |
          docker run --rm \
            -v "$RUNNER_TEMP/secureship-image.tar:/scan/image.tar:ro" \
            aquasec/trivy:0.76.1 \
            image --input /scan/image.tar \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --exit-code 0

      - name: Start application container
        run: |
          docker run -d \
            --name secureship-api \
            -p 127.0.0.1:8000:8000 \
            secureship:ci

      - name: Check application health
        shell: python
        run: |
          import json
          import time
          import urllib.request

          for attempt in range(20):
              try:
                  with urllib.request.urlopen(
                      "http://127.0.0.1:8000/health", timeout=2
                  ) as response:
                      if response.status != 200:
                          raise ValueError("Unexpected HTTP status")
                      if json.load(response) != {"status": "ok"}:
                          raise ValueError("Unexpected health response")

                  print("Container health check passed")
                  break
              except (OSError, ValueError):
                  if attempt == 19:
                      raise
                  time.sleep(1)

      - name: Verify non-root container user
        run: |
          test "$(docker exec secureship-api id -u)" = "10001"

      - name: Show logs and remove container
        if: always()
        run: |
          docker logs secureship-api || true
          docker rm -f secureship-api || true